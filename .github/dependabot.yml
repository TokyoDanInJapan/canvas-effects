# Keeps the toolchain and the actions current.
#
# Grouped into one pull request per ecosystem rather than one per dependency. Every
# npm dependency here is a development one - the published package has none, since
# it ships `dist` and `src` and nothing else - so a bump either passes `npm run ci`
# or does not, and there is nothing to be gained from finding that out eight times
# separately.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      toolchain:
        patterns: ['*']
    ignore:
      # TypeScript 7 is held back, and this is the whole reason the entry exists:
      # no released typescript-eslint supports it. The latest is 8.65.0 and its
      # peer range is `>=4.8.4 <6.1.0`, with no 9.x published, so a tree with
      # TypeScript 7 in it cannot be installed at all - `npm ci` fails ERESOLVE
      # before a single test runs. Dependabot proposed it in a group with five
      # other bumps and took the whole pull request down with it.
      #
      # Remove this the moment typescript-eslint's peer range opens up. Nothing
      # else here objects to 7; linting is the only thing standing in the way.
      - dependency-name: typescript
        versions: ['>=7']
    commit-message:
      prefix: 'Bump'
    open-pull-requests-limit: 3

  # The reason this is here: the actions were on Node 20 until someone noticed.
  # A monthly pull request notices for us.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'Bump'
    open-pull-requests-limit: 3
