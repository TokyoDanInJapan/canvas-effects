<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>canvas-effects</title>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <canvas id="background" aria-hidden="true"></canvas>

    <main>
      <h1 id="heading">canvas-effects</h1>
      <div id="copy"></div>
    </main>

    <aside id="panel">
      <div class="row effect">
        <button type="button" data-effect="smoke" class="active">Smoke</button>
        <button type="button" data-effect="plasma">Plasma</button>
        <button type="button" data-effect="rain">Rain</button>
        <button type="button" data-effect="ridges">Ridges</button>
        <button type="button" data-effect="fire">Fire</button>
        <button type="button" data-effect="metaballs">Blobs</button>
      </div>
      <div class="row">
        <button type="button" id="theme">Light</button>
        <button type="button" id="reseed">Reseed</button>
        <button type="button" id="dither" class="active">Dither: on</button>
      </div>
      <label class="pick">
        <span>palette <b id="ramp-name">greyscale</b></span>
        <select id="ramp"></select>
      </label>
      <div id="dials"></div>
      <p class="fps"><span id="fps">–</span> fps drawn</p>
    </aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
